[package]
name = "feather"
version = "0.1.0"
edition = "2021"
authors = ["The No Hands Company <erichakansson84@gmail.com>"]
description = "Feather Browser — ultra-lightweight GTK4 browser"
license = "AGPL-3.0-or-later"

[[bin]]
name = "feather"
path = "src/main.rs"

[lib]
name = "feather"
path = "src/lib.rs"

[features]
default = ["webkit-renderer"]
webkit-renderer = ["dep:webkit6"]
feather-renderer = ["dep:reqwest", "dep:fontdue"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
webkit6 = { version = "0.6", optional = true }
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
fontdue = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "pronbrow-engine"
version = "0.5.0"
edition = "2021"
authors = ["The No-hands Company"]
description = "A modern web browser engine built from scratch with 720+ features including HTML5 media, WebGL, WebRTC, Service Workers, IndexedDB, and comprehensive Web APIs"

[dependencies]
# Networking
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
url = "2.5"

# Image encoding
png = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
fontdue = "0.9.3"
ab_glyph = "0.2.32"
image = "0.25.8"
rand = "0.8"
uuid = { version = "1.18.1", features = ["v4"] }
napi = { version = "3.5.2", optional = true }
napi-derive = { version = "3.3.3", optional = true }
base64 = "0.22"
urlencoding = "2.1"

[lib]
name = "pronbrow_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pronbrow"
path = "src/main.rs"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = "2"

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PronBrow - Web Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser">
    <div class="toolbar">
      <button id="back-btn" title="Back">←</button>
      <button id="forward-btn" title="Forward">→</button>
      <button id="reload-btn" title="Reload">⟳</button>
      <input type="text" id="url-bar" placeholder="Enter URL or search...">
      <button id="go-btn">Go</button>
    </div>
    <webview id="webview" src="https://www.google.com"></webview>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

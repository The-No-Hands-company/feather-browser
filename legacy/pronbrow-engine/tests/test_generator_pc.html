<!DOCTYPE html>
<html>
<head>
    <title>Generator PC-Based Resumption Test</title>
</head>
<body>
    <h1>Generator PC-Based Resumption Test</h1>
    <div id="output"></div>

    <script>
        console.log("=== Generator PC-Based Resumption Tests ===");
        
        // Test 1: Simple multiple yields
        console.log("\nTest 1: Simple multiple yields");
        function* simpleGen() {
            console.log("Generator started");
            yield 1;
            console.log("After yield 1");
            yield 2;
            console.log("After yield 2");
            yield 3;
            console.log("After yield 3");
            return "done";
        }
        
        const gen1 = simpleGen();
        console.log("gen1.next():", gen1.next());  // Should be {value: 1, done: false}
        console.log("gen1.next():", gen1.next());  // Should be {value: 2, done: false}
        console.log("gen1.next():", gen1.next());  // Should be {value: 3, done: false}
        console.log("gen1.next():", gen1.next());  // Should be {value: "done", done: true}
        
        // Test 2: Generator with local variables
        console.log("\nTest 2: Generator with local variables");
        function* counterGen() {
            let count = 0;
            yield ++count;  // 1
            yield ++count;  // 2
            yield ++count;  // 3
            return count;
        }
        
        const gen2 = counterGen();
        console.log("gen2.next():", gen2.next());  // {value: 1, done: false}
        console.log("gen2.next():", gen2.next());  // {value: 2, done: false}
        console.log("gen2.next():", gen2.next());  // {value: 3, done: false}
        console.log("gen2.next():", gen2.next());  // {value: 3, done: true}
        
        // Test 3: Generator with expressions
        console.log("\nTest 3: Generator with expressions");
        function* exprGen() {
            yield 10 + 5;
            yield 20 * 2;
            yield 30 / 3;
        }
        
        const gen3 = exprGen();
        console.log("gen3.next():", gen3.next());  // {value: 15, done: false}
        console.log("gen3.next():", gen3.next());  // {value: 40, done: false}
        console.log("gen3.next():", gen3.next());  // {value: 10, done: false}
        console.log("gen3.next():", gen3.next());  // {value: undefined, done: true}
        
        // Test 4: Generator with conditionals
        console.log("\nTest 4: Generator with conditionals");
        function* condGen(x) {
            if (x > 0) {
                yield "positive";
            }
            yield "middle";
            if (x < 10) {
                yield "small";
            }
        }
        
        const gen4 = condGen(5);
        console.log("gen4.next():", gen4.next());  // {value: "positive", done: false}
        console.log("gen4.next():", gen4.next());  // {value: "middle", done: false}
        console.log("gen4.next():", gen4.next());  // {value: "small", done: false}
        console.log("gen4.next():", gen4.next());  // {value: undefined, done: true}
        
        // Test 5: Fibonacci generator
        console.log("\nTest 5: Fibonacci generator");
        function* fibonacci() {
            let a = 0, b = 1;
            yield a;
            yield b;
            for (let i = 0; i < 5; i++) {
                let temp = a + b;
                a = b;
                b = temp;
                yield temp;
            }
        }
        
        const fib = fibonacci();
        console.log("fib.next():", fib.next());  // {value: 0, done: false}
        console.log("fib.next():", fib.next());  // {value: 1, done: false}
        console.log("fib.next():", fib.next());  // {value: 1, done: false}
        console.log("fib.next():", fib.next());  // {value: 2, done: false}
        console.log("fib.next():", fib.next());  // {value: 3, done: false}
        console.log("fib.next():", fib.next());  // {value: 5, done: false}
        console.log("fib.next():", fib.next());  // {value: 8, done: false}
        console.log("fib.next():", fib.next());  // {value: undefined, done: true}
        
        console.log("\n=== All Generator Tests Complete ===");
    </script>
</body>
</html>

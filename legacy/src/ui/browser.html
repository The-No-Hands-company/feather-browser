<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PronBrow Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <!-- Title Bar -->
  <div class="title-bar">
    <div class="title-bar-left">
      <img src="../assets/logo.png" alt="PronBrow" class="logo" onerror="this.style.display='none'">
      <span class="app-title">PronBrow</span>
    </div>
    <div class="title-bar-center">
      <span id="page-title"></span>
    </div>
    <div class="title-bar-right">
      <button id="minimize-btn" class="window-btn">−</button>
      <button id="maximize-btn" class="window-btn">□</button>
      <button id="close-btn" class="window-btn close">×</button>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div id="tabs-container" class="tabs-container"></div>
    <button id="new-tab-btn" class="new-tab-btn" title="New Tab">+</button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <div class="nav-buttons">
      <button id="back-btn" class="nav-btn" title="Back" disabled>
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button id="forward-btn" class="nav-btn" title="Forward" disabled>
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
      <button id="reload-btn" class="nav-btn" title="Reload">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="home-btn" class="nav-btn" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
    </div>
    
    <div class="url-bar-container">
      <div class="url-bar-wrapper">
        <span id="security-icon" class="security-icon"></span>
        <input type="text" id="url-bar" placeholder="Search or enter address" autocomplete="off">
        <button id="bookmark-btn" class="url-action-btn" title="Bookmark this page">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        </button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="nav-actions">
      <button id="downloads-btn" class="nav-btn" title="Downloads">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <button id="extensions-btn" class="nav-btn" title="Extensions">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
      </button>
      <button id="menu-btn" class="nav-btn" title="Menu">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Content Area -->
  <div id="content-area" class="content-area">
    <div id="page-view" class="page-view"></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="status-text"></span>
    <div class="status-right">
      <span id="zoom-level">100%</span>
      <button id="devtools-btn" class="status-btn" title="Developer Tools">DevTools</button>
      <span id="engine-indicator" class="engine-indicator" title="Using PronBrow Engine">🚀 PronBrow</span>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden"></div>

  <!-- Menu Panel -->
  <div id="menu-panel" class="menu-panel hidden">
    <div class="menu-section">
      <button class="menu-item" data-action="new-tab">
        <span>New Tab</span>
        <span class="shortcut">Ctrl+T</span>
      </button>
      <button class="menu-item" data-action="new-window">
        <span>New Window</span>
        <span class="shortcut">Ctrl+N</span>
      </button>
      <button class="menu-item" data-action="new-private">
        <span>New Private Window</span>
        <span class="shortcut">Ctrl+Shift+N</span>
      </button>
    </div>
    <hr>
    <div class="menu-section">
      <button class="menu-item" data-action="history">History</button>
      <button class="menu-item" data-action="bookmarks">Bookmarks</button>
      <button class="menu-item" data-action="downloads">Downloads</button>
    </div>
    <hr>
    <div class="menu-section">
      <button class="menu-item" data-action="settings">Settings</button>
      <button class="menu-item" data-action="about">About PronBrow</button>
    </div>
    <hr>
    <div class="menu-section">
      <button class="menu-item" data-action="exit">Exit</button>
    </div>
  </div>

  <script src="browser.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Document Element</title>
</head>
<body>
    <h1>Testing document.documentElement and document.body</h1>
    <div id="output"></div>
    
    <script>
        console.log("Testing DOM access:");
        console.log("document.documentElement:", document.documentElement);
        console.log("document.body:", document.body);
        console.log("document.head:", document.head);
        
        // Test that they're not null
        if (document.documentElement) {
            console.log("✓ document.documentElement is available");
            document.documentElement.addEventListener("click", function() {
                console.log("Click on documentElement works!");
            });
        } else {
            console.log("✗ document.documentElement is NULL");
        }
        
        if (document.body) {
            console.log("✓ document.body is available");
            document.body.onload = function() {
                console.log("Body onload works!");
            };
        } else {
            console.log("✗ document.body is NULL");
        }
        
        if (document.head) {
            console.log("✓ document.head is available");
        } else {
            console.log("✗ document.head is NULL");
        }
        
        // Test clientWidth/clientHeight
        if (document.body) {
            console.log("document.body.clientWidth:", document.body.clientWidth);
            console.log("document.body.clientHeight:", document.body.clientHeight);
        }
    </script>
</body>
</html>
